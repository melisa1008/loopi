name: Publicar Loopi en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Son valores públicos requeridos por el navegador. La seguridad de los
    # envíos está en las políticas RLS de Supabase, no en esta clave.
    env:
      PUBLIC_SUPABASE_URL: https://hpcjamchbafagpcgojpw.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: sb_publishable_aIJ63E2bAsR3x3idK3ZzOQ_N8GugQtU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
