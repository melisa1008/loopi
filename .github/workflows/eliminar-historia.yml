name: Eliminar historia de Loopi

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  remove:
    if: github.event.issue.author_association == 'OWNER' && contains(github.event.issue.labels.*.name, 'eliminar historia')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const link = body.match(/### Enlace de la historia\s*\n\s*([^\n]+)/)?.[1]?.trim() || '';
            const match = link.match(/\/(es|en|fr)\/historias\/([^/?#]+)/);
            if (!match) core.setFailed('El enlace de la historia no es válido.');
            const [, language, slug] = match;
            const path = `src/content/stories/${language}/${slug}.md`;
            const file = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
            await github.rest.repos.deleteFile({ owner: context.repo.owner, repo: context.repo.repo, path, sha: file.data.sha, message: `Eliminar historia: ${slug}`, branch: 'main' });
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: '🗑️ Historia eliminada. Loopi se actualizará automáticamente en unos minutos.' });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
